# Allowed FRONTEND origins (reflected in Access-Control-Allow-Origin).
# List the origin the test page is loaded from, not the API's own hostname.
#   frontend: https://yohr-web.f5xc.cloud  (XC LB -> :8080)
#   API:      https://yohr-api.f5xc.cloud      (XC LB -> :8081)
map $http_origin $cors_origin {
    default                              "";
    "~^https?://[A-Za-z0-9.-]+:8080$"    $http_origin;   # test page opened directly on :8080
    "https://yohr-web.f5xc.cloud"        $http_origin;   # test page via XC LB
}

# ---------------- Test frontend----------------
# Published as https://yohr-web.f5xc.cloud
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ---------------- Backend API (simulates yohr-api) ----------------
# Published as https://yohr-api.f5xc.cloud
# Original CORS policy: only Content-Type and Authorization are allowed.
# Bot Defense headers (xa4vrhyp3q-*) are NOT allowed here on purpose;
# the BIG-IP iRule adds them to the preflight response.
server {
    listen 8081;
    server_name _;
    default_type application/json;

    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers     "Content-Type, Authorization" always;
    add_header Access-Control-Max-Age           "600" always;
    add_header Vary                             "Origin" always;

    access_log /dev/stdout;

    location = /health {
        return 200 '{"status":"up"}';
    }

    location / {
        if ($request_method = OPTIONS) { return 204; }
        # Echo back whether a Bot Defense header reached the backend
        return 200 '{"ok":true,"method":"$request_method","path":"$uri","bd_header_seen":"$http_xa4vrhyp3q_a"}';
    }
}
